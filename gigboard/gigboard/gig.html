<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gig details · GigBoard KE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root"></div>

  <script src="js/app.js"></script>
  <script>
    const user = renderShell({ client: 'activity', freelancer: 'gigs' }, 'Gig details');
    const gigId = Number(new URLSearchParams(location.search).get('id'));
    let pickedRating = 0;      // star rating chosen in the review form

    /* ---------- Actions (called from buttons below) ---------- */
    function show(result, successMessage) {
      if (result.ok) { toast(successMessage); render(); }
      else toast(result.error, 'error');
    }
    function doApply() {
      show(applyToGig(gigId, user.id, $('#bid').value, $('#proposal').value), 'Application sent');
    }
    function doHire(appId) { show(hireApplicant(appId), 'Freelancer hired'); }
    function doComplete() { show(completeGig(gigId), 'Gig marked as complete'); }
    function doPay(paid) { show(setPayment(gigId, paid, paid ? $('#ref').value : ''), paid ? 'Payment recorded' : 'Payment set to pending'); }
    function pick(n) {
      pickedRating = n;
      $$('.star-pick button').forEach((b, i) => b.classList.toggle('on', i < n));
    }
    function doReview() { show(addReview(gigId, user.id, pickedRating, $('#comment').value), 'Review submitted'); }

    /* ---------- Sections ---------- */
    function applicantsSection(g) {
      const apps = gigApplications(g.id);
      if (!apps.length) {
        return `<div class="card"><h3>Applicants</h3><p class="muted">No applications yet. Freelancers will appear here.</p></div>`;
      }
      return `
        <div class="section-title"><h2>Applicants (${apps.length})</h2></div>
        ${apps.map(a => {
          const f = userById(a.freelancerId);
          return `
            <div class="card">
              <div class="row top">
                <div class="row" style="justify-content:flex-start">
                  <div class="avatar">${esc(initials(f.name))}</div>
                  <div><a href="profile.html?id=${f.id}" style="font-weight:700">${esc(f.name)}</a><div class="muted small">${ratingLabel(f.id)}</div></div>
                </div>
                <span class="price">${ksh(a.price)}</span>
              </div>
              <p class="muted" style="margin:10px 0">${esc(a.proposal)}</p>
              <button class="btn sm" onclick="doHire(${a.id})">Hire ${esc(f.name.split(' ')[0])}</button>
            </div>`;
        }).join('')}`;
    }

    function applySection(g) {
      if (hasApplied(g.id, user.id)) {
        const mine = gigApplications(g.id).find(a => a.freelancerId === user.id);
        return `<div class="card"><h3>Your application</h3><p>Bid: <b>${ksh(mine.price)}</b></p><p class="muted" style="margin-top:6px">${esc(mine.proposal)}</p><p style="margin-top:10px"><span class="tag warn">Waiting for the client</span></p></div>`;
      }
      return `
        <div class="card">
          <h3>Apply for this gig</h3>
          <label for="bid">Your price (KSh)</label>
          <input id="bid" type="number" min="100" value="${g.budget}">
          <label for="proposal">Short proposal</label>
          <textarea id="proposal" placeholder="Tell the client why you are a good fit and how soon you can deliver."></textarea>
          <p style="margin-top:12px"><button class="btn block" onclick="doApply()">Send application</button></p>
        </div>`;
    }

    function progressSection(g, hired, freelancer, isOwner) {
      let html = `<div class="card"><h3>${g.status === 'completed' ? 'Completed' : 'In progress'}</h3>
        <p>${isOwner ? 'Freelancer' : 'Client'}: <a href="profile.html?id=${isOwner ? freelancer.id : g.clientId}" style="font-weight:700">${esc(isOwner ? freelancer.name : userById(g.clientId).name)}</a></p>
        <p class="muted">Agreed price: ${ksh(hired.price)}</p>`;

      if (g.status === 'in_progress') {
        html += isOwner
          ? `<p style="margin-top:12px"><button class="btn" onclick="doComplete()">Mark as complete</button></p>`
          : `<p class="muted small" style="margin-top:10px">The client will mark the gig complete when the work is delivered.</p>`;
      }

      if (g.status === 'completed') {
        html += `<div style="margin-top:12px">Payment: ${g.paid ? `<span class="tag ok">Paid${g.payRef ? ' · ' + esc(g.payRef) : ''}</span>` : '<span class="tag warn">Pending</span>'}</div>`;
        if (isOwner) {
          html += g.paid
            ? `<p style="margin-top:10px"><button class="btn ghost sm" onclick="doPay(false)">Set back to pending</button></p>`
            : `<label for="ref">M-Pesa code (optional)</label><input id="ref" placeholder="e.g. SJK3L9XQ2P">
               <p style="margin-top:10px"><button class="btn sm" onclick="doPay(true)">Mark as paid</button></p>
               <p class="muted small" style="margin-top:8px">GigBoard only records payment status. Pay the freelancer yourself, for example by M-Pesa.</p>`;
        }
      }
      return html + '</div>';
    }

    function reviewSection(g, hired) {
      if (g.status !== 'completed') return '';
      const mine = db.reviews.find(r => r.gigId === g.id && r.reviewerId === user.id);
      const revealed = reviewsRevealed(g.id);
      let html = `<div class="section-title"><h2>Reviews</h2></div>`;

      if (!mine) {
        html += `
          <div class="card">
            <h3>Leave a review</h3>
            <div class="star-pick">${[1, 2, 3, 4, 5].map(n => `<button type="button" onclick="pick(${n})">★</button>`).join('')}</div>
            <label for="comment">Comment (optional)</label>
            <textarea id="comment" placeholder="How was the experience?"></textarea>
            <p style="margin-top:12px"><button class="btn" onclick="doReview()">Submit review</button></p>
          </div>`;
      } else {
        html += `<div class="card"><p>You rated: <span class="stars">${stars(mine.rating)}</span></p></div>`;
      }

      if (revealed) {
        html += db.reviews.filter(r => r.gigId === g.id).map(r => `
          <div class="card">
            <div class="row"><b>${esc(userById(r.reviewerId).name)}</b><span class="stars">${stars(r.rating)}</span></div>
            <p class="muted" style="margin-top:6px">${esc(r.comment || 'No comment.')}</p>
          </div>`).join('');
      } else if (mine) {
        html += `<p class="muted small">Reviews are revealed once both sides have submitted.</p>`;
      }
      return html;
    }

    /* ---------- Page ---------- */
    function render() {
      const g = getGig(gigId);
      if (!g) {
        setView(emptyState('🤷', 'This gig does not exist.') + '<p style="text-align:center"><a class="btn ghost" href="dashboard.html">Back to home</a></p>');
        return;
      }
      const client = userById(g.clientId);
      const hired = hiredApp(g);
      const freelancer = hired ? userById(hired.freelancerId) : null;
      const isOwner = user.id === g.clientId;
      const isHiredFreelancer = hired && hired.freelancerId === user.id;

      let html = `
        <p style="margin-bottom:12px"><a class="muted" href="javascript:history.back()">← Back</a></p>
        <div class="card">
          <div class="row top">
            <span class="tag">${CAT_ICON[g.category] || ''} ${esc(g.category)}</span>
            ${statusTag(g)}
          </div>
          <h1 style="margin:12px 0 6px">${esc(g.title)}</h1>
          <div class="price" style="font-size:20px">${ksh(g.budget)}</div>
          <p style="margin:12px 0">${esc(g.desc)}</p>
          <div class="muted small">📍 ${esc(g.location)}${g.deadline ? ' · Due ' + esc(g.deadline) : ''} · Posted ${timeAgo(g.createdAt)}</div>
          <div class="row" style="margin-top:14px;justify-content:flex-start">
            <div class="avatar">${esc(initials(client.name))}</div>
            <div><a href="profile.html?id=${client.id}" style="font-weight:700">${esc(client.name)}</a><div class="muted small">${ratingLabel(client.id)}</div></div>
          </div>
        </div>`;

      if (isOwner) {
        html += g.status === 'open' ? applicantsSection(g) : progressSection(g, hired, freelancer, true);
      } else if (user.role === 'freelancer') {
        if (isHiredFreelancer) html += progressSection(g, hired, freelancer, false);
        else if (g.status === 'open') html += applySection(g);
        else html += `<div class="card"><p class="muted">This gig is no longer open for applications.</p></div>`;
      }

      if (isOwner || isHiredFreelancer) html += reviewSection(g, hired);
      setView(html);
    }

    if (user) render();
  </script>
</body>
</html>
