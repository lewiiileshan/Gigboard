<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Post a gig · GigBoard KE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root"></div>

  <script src="js/app.js"></script>
  <script>
    const user = renderShell('post', 'Post a gig');

    if (user && onlyFor(user, 'client', 'Only clients can post gigs. Switch to a client account to hire freelancers.')) {
      setView(`
        <div class="page-head"><div><h1>Post a gig</h1><p class="muted">Tell freelancers what you need done.</p></div></div>

        <form class="card" id="gig-form" novalidate>
          <label for="title" style="margin-top:0">Gig title</label>
          <input id="title" placeholder="e.g. Design a flyer for my shop opening">

          <div class="form-row">
            <div>
              <label for="category">Category</label>
              <select id="category">${CATEGORIES.map(c => `<option>${esc(c)}</option>`).join('')}</select>
            </div>
            <div>
              <label for="budget">Budget (KSh)</label>
              <input id="budget" type="number" min="100" placeholder="e.g. 3000">
            </div>
          </div>

          <div class="form-row">
            <div>
              <label for="location">Location</label>
              <select id="location">
                <option>Remote</option>
                ${Object.keys(AREAS).map(a => `<option ${a === user.location ? 'selected' : ''}>${esc(a)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label for="deadline">Deadline (optional)</label>
              <input id="deadline" type="date">
            </div>
          </div>

          <label for="desc">Description</label>
          <textarea id="desc" placeholder="Describe the work, what you expect to receive and any important details."></textarea>

          <div class="error" id="error"></div>
          <button class="btn block" type="submit">Post gig</button>
        </form>
      `);

      $('#gig-form').addEventListener('submit', event => {
        event.preventDefault();
        const result = createGig(user.id, {
          title: $('#title').value,
          category: $('#category').value,
          budget: $('#budget').value,
          location: $('#location').value,
          deadline: $('#deadline').value,
          desc: $('#desc').value
        });
        if (result.ok) {
          location.href = 'gig.html?id=' + result.gig.id;   // go to the new gig's page
        } else {
          $('#error').textContent = result.error;
        }
      });
    }
  </script>
</body>
</html>
