<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Settings · GigBoard KE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="root"></div>

  <script src="js/app.js"></script>
  <script>
    const user = renderShell('settings', 'Settings');

    function saveAccount(event) {
      event.preventDefault();
      const name = $('#s-name').value.trim();
      const email = $('#s-email').value.trim().toLowerCase();
      if (name.length < 2) return toast('Enter your full name.', 'error');
      if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Enter a valid email.', 'error');
      if (db.users.some(u => u.id !== user.id && u.email.toLowerCase() === email)) return toast('That email is already used.', 'error');
      user.name = name;
      user.email = email;
      user.phone = $('#s-phone').value.trim();
      saveDB();
      toast('Account saved');
      render();
    }

    function changePassword(event) {
      event.preventDefault();
      const current = $('#pw-current').value;
      const next = $('#pw-new').value;
      if (current !== user.password) return toast('Current password is wrong.', 'error');
      if (next.length < 6) return toast('New password must be at least 6 characters.', 'error');
      if (next !== $('#pw-confirm').value) return toast('Passwords do not match.', 'error');
      user.password = next;
      saveDB();
      event.target.reset();
      toast('Password changed');
    }

    function toggleSetting(key, checked) {
      user.settings[key] = checked;
      saveDB();
      toast('Preference saved');
    }

    function resetDemo() {
      if (!confirm('Reset all demo data? Accounts you created will be removed.')) return;
      resetDemoData();
      logout();
    }

    function deleteAccount() {
      if (!confirm('Delete your account? This cannot be undone.')) return;
      db.users = db.users.filter(u => u.id !== user.id);
      saveDB();
      logout();
    }

    function switchRow(key, title, hint) {
      return `
        <div class="switch-row">
          <div><div>${title}</div><div class="muted small">${hint}</div></div>
          <label class="switch" style="margin:0">
            <input type="checkbox" ${user.settings[key] ? 'checked' : ''} onchange="toggleSetting('${key}', this.checked)">
            <span></span>
          </label>
        </div>`;
    }

    function render() {
      setView(`
        <div class="page-head"><div><h1>Settings</h1><p class="muted">Manage your account and preferences.</p></div></div>

        <form class="card" onsubmit="saveAccount(event)" novalidate>
          <h3>Account</h3>
          <label for="s-name">Full name</label>
          <input id="s-name" value="${esc(user.name)}">
          <div class="form-row">
            <div><label for="s-email">Email</label><input id="s-email" type="email" value="${esc(user.email)}"></div>
            <div><label for="s-phone">Phone</label><input id="s-phone" type="tel" value="${esc(user.phone)}"></div>
          </div>
          <p style="margin-top:14px"><button class="btn" type="submit">Save changes</button></p>
        </form>

        <form class="card" onsubmit="changePassword(event)" novalidate>
          <h3>Change password</h3>
          <label for="pw-current">Current password</label>
          <input id="pw-current" type="password" autocomplete="current-password">
          <div class="form-row">
            <div><label for="pw-new">New password</label><input id="pw-new" type="password" autocomplete="new-password"></div>
            <div><label for="pw-confirm">Confirm new password</label><input id="pw-confirm" type="password" autocomplete="new-password"></div>
          </div>
          <p style="margin-top:14px"><button class="btn" type="submit">Update password</button></p>
        </form>

        <div class="card">
          <h3>Notifications</h3>
          ${switchRow('notifyApplications', user.role === 'client' ? 'New applications' : 'Hiring decisions', user.role === 'client' ? 'Tell me when a freelancer applies to my gig.' : 'Tell me when a client accepts my application.')}
          ${switchRow('notifyPayments', 'Payment updates', 'Tell me when a payment is marked as paid.')}
          ${switchRow('notifyTips', 'Tips and news', 'Occasional product updates from GigBoard.')}
        </div>

        <div class="card">
          <h3>Demo tools</h3>
          <p class="muted small" style="margin-bottom:10px">Restore the sample gigs and accounts. Useful before presenting.</p>
          <button class="btn ghost" onclick="resetDemo()">Reset demo data</button>
        </div>

        <div class="card">
          <h3>Account actions</h3>
          <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
            <button class="btn ghost" onclick="logout()">Log out</button>
            <button class="btn danger" onclick="deleteAccount()">Delete account</button>
          </div>
        </div>
      `);
    }

    if (user) render();
  </script>
</body>
</html>
